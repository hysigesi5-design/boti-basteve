
name: Bot Sinjalesh Ndeshjesh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Shkarko kodin
        uses: actions/checkout@v4

      - name: Instalo Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalo libraritë
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Nis skriptin
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python bot.py
